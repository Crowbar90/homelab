apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: bazarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      bazarr:
        type: deployment
        replicas: 1
        containers:
          bazarr:
            image:
              repository: ghcr.io/hotio/bazarr
              tag: release-1.6.0
    service:
      bazarr:
        controller: bazarr
        type: ClusterIP
        ports:
          http:
            port: 6767
            protocol: HTTP
            primary: true
    ingress:
      bazarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host bazarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: bazarr
                  port: http
        tls:
          - secretName: bazarr-tls
            hosts:
              - *host
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        retain: true
        size: 200Mi
        storageClass: nfs-client
        suffix: config
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        existingClaim: nfs-data-pvc
        globalMounts:
          - path: /mnt/tower/data
