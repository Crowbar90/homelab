apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: profilarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      profilarr:
        type: deployment
        replicas: 1
        containers:
          prowlarr:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr
              tag: 2
            env:
              - name: ORIGIN
                value: https://profilarr.k3s.middleearth.cc
    service:
      profilarr:
        controller: profilarr
        type: ClusterIP
        ports:
          http:
            port: 6868
            protocol: HTTP
            primary: true
    ingress:
      profilarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host profilarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: profilarr
                  port: http
        tls:
          - secretName: profilarr-tls
            hosts:
              - *host
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        retain: true
        size: 200Mi
        storageClass: nfs-client
        suffix: config
        globalMounts:
          - path: /config
