apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: decypharr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      decypharr:
        type: deployment
        replicas: 1
        containers:
          decypharr:
            image:
              repository: cy01/blackhole
              tag: v2.5
    service:
      decypharr:
        controller: decypharr
        type: ClusterIP
        ports:
          http:
            port: 8282
            protocol: HTTP
            primary: true
    ingress:
      decypharr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host decypharr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: decypharr
                  port: http
        tls:
          - secretName: decypharr-tls
            hosts:
              - *host
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        retain: true
        size: 200Mi
        storageClass: nfs-client
        suffix: config
        globalMounts:
          - path: /app
      data:
        type: persistentVolumeClaim
        existingClaim: nfs-data-pvc
        globalMounts:
          - path: /mnt/tower/data
