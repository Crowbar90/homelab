apiVersion: v1
kind: ConfigMap
metadata:
  name: symlink-downloader-script
  namespace: media
data:
  download_and_swap.sh: |
    #!/bin/bash
    set -euo pipefail

    TORRENTS_DIR="/mnt/tower/data/torrents"
    MEDIA_DIR="/mnt/tower/data/media"
    STAGING_DIR="/mnt/tower/data/staging"

    mkdir -p "$STAGING_DIR"

    echo "[CRON] Starting symlink scan in $TORRENTS_DIR..."

    found_count=0

    # 1. Find ALL symbolic links in /data/torrents
    while read -r torrent_symlink; do
      # Skip empty lines if find returns nothing
      [ -z "$torrent_symlink" ] && continue
      
      target=$(readlink -f "$torrent_symlink")

      if [[ "$target" == *"/data/debrid/torbox"* ]]; then
        ((found_count++))
        filename=$(basename "$torrent_symlink")
        staging_file="$STAGING_DIR/$filename"

        echo "[FOUND] Processing cloud symlink: $torrent_symlink"

        inode=$(stat -c %i "$torrent_symlink")
        link_count=$(stat -c %h "$torrent_symlink")

        media_links=()
        if [ "$link_count" -gt 1 ]; then
          echo "[SEARCHING] Link count is $link_count. Locating media hardlinks by inode ($inode)..."
          mapfile -t media_links < <(find "$MEDIA_DIR" -maxdepth 4 -inum "$inode" 2>/dev/null || true)
        fi

        echo "[DOWNLOADING] Copying physical file bytes to staging..."
        cp "$target" "$staging_file"

        echo "[REPLACING] Overwriting symlink in /data/torrents with physical file..."
        mv -f "$staging_file" "$torrent_symlink"
        chmod 664 "$torrent_symlink"

        for media_link in "${media_links[@]}"; do
          if [ -n "$media_link" ]; then
            echo "[RELINKING] Updating media path: $media_link"
            ln -f "$torrent_symlink" "$media_link"
          fi
        done

        echo "[SUCCESS] $filename is now completely local!"
      fi
    done < <(find "$TORRENTS_DIR" -type l 2>/dev/null || true)

    echo "[CRON] Scan complete. Processed $found_count pending cloud symlink(s)."