apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sonarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      sonarr:
        type: deployment
        replicas: 2
        containers:
          sonarr:
            image:
              repository: ghcr.io/hotio/sonarr
              tag: release-4.0.19.2979
            env:
              - name: SONARR__POSTGRES__HOST
                value: "192.168.40.21"
              - name: SONARR__POSTGRES__PORT
                value: "5432"
              - name: SONARR__POSTGRES__MAINDB
                value: "sonarr-main"
              - name: SONARR__POSTGRES__LOGDB
                value: "sonarr-log"
              - name: SONARR__POSTGRES__USER
                value: "sonarr"
              - name: SONARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secrets
                    key: SONARR__POSTGRES__PASSWORD
    service:
      sonarr:
        controller: sonarr
        type: ClusterIP
        ports:
          http:
            port: 8989
            protocol: HTTP
            primary: true
    ingress:
      sonarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host sonarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: sonarr
                  port: http
        tls:
          - secretName: sonarr-tls
            hosts:
              - *host
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        size: 200Mi
        storageClass: nfs-client
        globalMounts:
          - path: /config
