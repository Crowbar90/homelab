apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: radarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      radarr:
        type: deployment
        replicas: 1
        containers:
          radarr:
            image:
              repository: ghcr.io/hotio/radarr
              tag: release-6.3.0.10514
            env:
              - name: RADARR__POSTGRES__HOST
                value: "192.168.40.21"
              - name: RADARR__POSTGRES__PORT
                value: "5432"
              - name: RADARR__POSTGRES__MAINDB
                value: "radarr-main"
              - name: RADARR__POSTGRES__LOGDB
                value: "radarr-log"
              - name: RADARR__POSTGRES__USER
                value: "radarr"
              - name: RADARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: radarr-secrets
                    key: RADARR__POSTGRES__PASSWORD
    service:
      radarr:
        controller: radarr
        type: ClusterIP
        ports:
          http:
            port: 8989
            protocol: HTTP
            primary: true
    ingress:
      radarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host radarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: radarr
                  port: http
        tls:
          - secretName: radarr-tls
            hosts:
              - *host
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        retain: true
        size: 200Mi
        storageClass: nfs-client
        suffix: config
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        existingClaim: nfs-data-pvc
        globalMounts:
          - path: /mnt/tower/data
