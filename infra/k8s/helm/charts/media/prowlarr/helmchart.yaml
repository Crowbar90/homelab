apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prowlarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      prowlarr:
        type: deployment
        replicas: 1
        containers:
          prowlarr:
            image:
              repository: ghcr.io/hotio/prowlarr
              tag: release-2.5.2.5491
            env:
              - name: PROWLARR__POSTGRES__HOST
                value: "192.168.40.21"
              - name: PROWLARR__POSTGRES__PORT
                value: "5432"
              - name: PROWLARR__POSTGRES__MAINDB
                value: "prowlarr-main"
              - name: PROWLARR__POSTGRES__LOGDB
                value: "prowlarr-log"
              - name: PROWLARR__POSTGRES__USER
                value: "prowlarr"
              - name: PROWLARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-secrets
                    key: PROWLARR__POSTGRES__PASSWORD
    service:
      prowlarr:
        controller: prowlarr
        type: ClusterIP
        ports:
          http:
            port: 9696
            protocol: HTTP
            primary: true
    ingress:
      prowlarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host prowlarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: prowlarr
                  port: http
        tls:
          - secretName: prowlarr-tls
            hosts:
              - *host
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        retain: true
        size: 200Mi
        storageClass: nfs-client
        suffix: config
        globalMounts:
          - path: /config
