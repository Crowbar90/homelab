apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: violarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: media
  valuesContent: |-
    controllers:
      violarr:
        type: deployment
        replicas: 1
        containers:
          radarr:
            image:
              repository: ghcr.io/xbit18/violarr
              tag: "1.2.0"
    service:
      violarr:
        controller: violarr
        type: ClusterIP
        ports:
          http:
            port: 8000
            protocol: HTTP
            primary: true
    ingress:
      violarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host violarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: violarr
                  port: http
        tls:
          - secretName: violarr-tls
            hosts:
              - *host
    persistence:
      icvdb-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        retain: true
        size: 20Gi
        storageClass: nfs-client
        suffix: icvfb-data
        globalMounts:
          - path: /data
