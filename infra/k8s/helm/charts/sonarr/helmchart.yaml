apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sonarr
  namespace: kube-system
spec:
  bootstrap: false
  chart: app-template
  repo: https://bjw-s-labs.github.io/helm-charts
  version: "5.1.0"
  targetNamespace: sonarr
  valuesContent: |-
    controllers:
      sonarr:
        type: deployment
        replicas: 1
        containers:
          sonarr:
            image:
              repository: ghcr.io/hotio/sonarr
              tag: release-4.0.19.2979
    service:
      sonarr:
        controller: sonarr
        type: ClusterIP
        ports:
          http:
            port: 8989
            protocol: HTTP
            primary: true
    ingress:
      sonarr:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cloudflare
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host sonarr.k3s.middleearth.cc
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: sonarr
                  port: http
        tls:
          - secretName: sonarr-tls
            hosts:
              - *host
  valuesSecrets:
    - name: sonarr-secrets
      ignoreUpdates: false
      keys:
        - controllers
